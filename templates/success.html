<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — MyStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy:       #0d1f3c;
            --navy-mid:   #162d54;
            --navy-light: #1e3f73;
            --cream:      #f5f0e8;
            --cream-dark: #ede6d6;
            --gold:       #c9a84c;
            --gold-light: #e4c97e;
            --text-mid:   #4a5568;
            --white:      #ffffff;
        }

        body {
            min-height: 100vh;
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--navy);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            border: 1.5px solid rgba(201,168,76,0.12);
            pointer-events: none;
        }
        body::before { width: 700px; height: 700px; top: -260px; right: -200px; }
        body::after  { width: 500px; height: 500px; bottom: -180px; left: -160px; }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--navy);
            height: 62px;
            display: flex;
            align-items: center;
            padding: 0 2.5rem;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(13,31,60,0.35);
        }
        .nav-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--cream);
            letter-spacing: 0.04em;
            text-decoration: none;
        }
        .nav-brand span { color: var(--gold); }

        /* CARD */
        .card {
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 8px 40px rgba(13,31,60,0.13);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            margin-top: 62px;
            animation: rise .45s cubic-bezier(.22,1,.36,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-strip {
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
        }

        /* dark top */
        .card-top {
            background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 100%);
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-top::before {
            content: '';
            position: absolute;
            width: 280px; height: 280px;
            border-radius: 50%;
            border: 1.5px solid rgba(201,168,76,0.15);
            top: -100px; right: -80px;
        }
        .success-ring {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 2.5px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.9rem;
            position: relative;
            z-index: 1;
        }
        .card-top h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 0.3rem;
            position: relative;
            z-index: 1;
        }
        .card-top p {
            font-size: 0.85rem;
            color: rgba(245,240,232,0.6);
            position: relative;
            z-index: 1;
        }

        /* details */
        .card-body { padding: 1.6rem 2rem; }

        .details-label {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 0.9rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--cream-dark);
            font-size: 0.875rem;
            gap: 1rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-key {
            color: var(--text-mid);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .detail-val {
            color: var(--navy);
            font-weight: 500;
            text-align: right;
        }

        /* total highlight */
        .detail-row.total {
            background: var(--cream);
            margin: 0.5rem -2rem -1.6rem;
            padding: 0.9rem 2rem;
            border-bottom: none;
            border-radius: 0;
        }
        .detail-row.total .detail-key { color: var(--navy); font-weight: 500; }
        .detail-row.total .detail-val {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 700;
        }

        /* footer buttons */
        .card-footer {
            padding: 1.4rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .btn-primary {
            display: block;
            text-align: center;
            background: var(--navy);
            color: var(--cream);
            padding: 0.72rem 1rem;
            border-radius: 9px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-decoration: none;
            transition: background .2s, transform .15s;
        }
        .btn-primary:hover { background: var(--navy-light); transform: translateY(-1px); }

        .btn-ghost {
            display: block;
            text-align: center;
            background: transparent;
            color: var(--text-mid);
            padding: 0.65rem 1rem;
            border-radius: 9px;
            font-size: 0.85rem;
            text-decoration: none;
            border: 1.5px solid var(--cream-dark);
            transition: border-color .2s, color .2s;
        }
        .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="nav-brand">Mini<span>Cart</span></a>
    </nav>

    <div class="card">
        <div class="card-strip"></div>

        <div class="card-top">
            <div class="success-ring">🎉</div>
            <h1>Order Confirmed!</h1>
            <p>Your order has been placed successfully.</p>
        </div>

        <div class="card-body">
            <p class="details-label">Order Summary</p>

            <div class="detail-row">
                <span class="detail-key">Order No.</span>
                <span class="detail-val">#{{ order_id }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-key">Name</span>
                <span class="detail-val">{{ name }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-key">Address</span>
                <span class="detail-val">{{ address }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-key">City</span>
                <span class="detail-val">{{ city }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-key">Pincode</span>
                <span class="detail-val">{{ pincode }}</span>
            </div>

            <div class="detail-row total">
                <span class="detail-key">Total Amount</span>
                <span class="detail-val">₹{{ total_price }}</span>
            </div>
        </div>

        <div class="card-footer">
            <a href="/orders" class="btn-primary">View My Orders</a>
            <a href="/" class="btn-ghost">Continue Shopping</a>
        </div>
    </div>

</body>
</html>
