<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      color: #1a2b3c;
    }

    /* ── NAVBAR ── */
    .mp-nav {
      background: #0a1520;
      border-bottom: 1px solid rgba(201, 168, 76, 0.33);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .mp-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #c9a84c, #f0d98c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .mp-nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mp-nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .mp-nav-link {
      color: #a09070;
      font-size: 13px;
      text-decoration: none;
      padding: 6px 11px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .mp-nav-link:hover { color: #f0d98c; background: rgba(201, 168, 76, 0.08); }
    .mp-nav-link.active {
      color: #f0d98c;
      background: rgba(201, 168, 76, 0.12);
      font-weight: 500;
    }
    .mp-nav-divider {
      width: 1px;
      height: 20px;
      background: rgba(201, 168, 76, 0.2);
      margin: 0 4px;
    }

    /* PROFILE DROPDOWN */
    .mp-drop-wrap { position: relative; }
    .mp-drop-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 8px;
      padding: 6px 13px;
      color: #f0d98c;
      font-size: 13px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .mp-drop-btn:hover { background: rgba(201, 168, 76, 0.18); }
    .mp-drop-btn i { font-size: 16px; color: #c9a84c; }
    .mp-drop-caret { font-size: 13px; color: #a09070; transition: transform 0.2s; }
    .mp-drop-caret.open { transform: rotate(180deg); }

    .mp-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: #0d1e2e;
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 12px;
      min-width: 160px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .mp-dropdown.show { display: block; }
    .mp-drop-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      font-size: 13px;
      color: #c8bfa8;
      text-decoration: none;
      transition: background 0.15s;
    }
    .mp-drop-item:hover { background: rgba(201, 168, 76, 0.1); color: #f0d98c; }
    .mp-drop-item i { font-size: 15px; }
    .mp-drop-item.danger { color: #e08080; }
    .mp-drop-item.danger:hover { background: rgba(200, 80, 80, 0.1); color: #f09090; }
    .mp-drop-sep { border: none; border-top: 1px solid rgba(201, 168, 76, 0.15); margin: 0; }

    /* ── CONTENT ── */
    .mp-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    .mp-page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: #0a1520;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .mp-page-sub {
      font-size: 12px;
      color: #7a6e5f;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* GRID */
    .mp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* PRODUCT CARD */
    .mp-card {
      background: #fffdf8;
      border: 1px solid rgba(217, 201, 154, 0.35);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(201, 168, 76, 0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .mp-card:hover {
      box-shadow: 0 6px 24px rgba(201, 168, 76, 0.14);
      transform: translateY(-2px);
    }
    .mp-thumb {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f0e8d0;
      display: block;
    }
    .mp-thumb-ph {
      width: 100%;
      height: 190px;
      background: #f0e8d0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mp-thumb-ph i { font-size: 40px; color: #c9a84c; }

    .mp-card-body { padding: 16px; }
    .mp-card-name {
      font-size: 15px;
      font-weight: 500;
      color: #0a1520;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp-card-desc {
      font-size: 13px;
      color: #8a7a66;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .mp-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #ede5cc;
    }
    .mp-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: #8a6e1a;
    }
    .mp-actions { display: flex; gap: 8px; }

    .mp-btn-edit {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0e8d0;
      border: 1px solid rgba(201, 168, 76, 0.4);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #8a6e1a;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .mp-btn-edit:hover { background: #e8dab8; }
    .mp-btn-edit i { font-size: 14px; }

    .mp-btn-del {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fdf0f0;
      border: 1px solid rgba(200, 100, 100, 0.25);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #b05050;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    .mp-btn-del:hover { background: #f8e0e0; }
    .mp-btn-del i { font-size: 14px; }

    /* EMPTY */
    .mp-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #8a7a66;
    }
    .mp-empty i { font-size: 48px; color: #d4c9aa; display: block; margin-bottom: 14px; }
    .mp-empty p { font-size: 15px; }

    /* RESPONSIVE */
    @media (max-width: 680px) {
      .mp-nav-links { display: none; }
      .mp-nav { padding: 0 16px; }
      .mp-container { padding: 20px 12px 40px; }
      .mp-page-title { font-size: 24px; }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="mp-nav">
    <span class="mp-brand">Minicart</span>

    <div class="mp-nav-right">
      <div class="mp-nav-links">
        <a href="/merchant-dashboard" class="mp-nav-link">Dashboard</a>
        <a href="/add-product" class="mp-nav-link">Add Product</a>
        <a href="/products" class="mp-nav-link active">Products</a>
        <a href="/orders" class="mp-nav-link">Orders</a>
        <div class="mp-nav-divider"></div>
      </div>

      <!-- PROFILE DROPDOWN -->
      <div class="mp-drop-wrap">
        <button class="mp-drop-btn" onclick="toggleDrop()">
          <i class="ti ti-user-circle"></i>
          {{ session.user_name }}
          <i class="ti ti-chevron-down mp-drop-caret" id="dropCaret"></i>
        </button>
        <div class="mp-dropdown" id="dropdown">
          <a href="/merchant/profile" class="mp-drop-item">
            <i class="ti ti-user"></i> My Profile
          </a>
          <hr class="mp-drop-sep">
          <a href="/logout" class="mp-drop-item danger">
            <i class="ti ti-logout"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="mp-container">
    <div class="mp-page-title">All Products</div>
    <div class="mp-page-sub">Manage your product catalogue</div>

    <div class="mp-grid">

      {% if products %}

        {% for p in products %}
        <div class="mp-card">

          {% if p[4] %}
            <img src="{{ p[4] }}" class="mp-thumb" alt="{{ p[1] }}">
          {% else %}
            <div class="mp-thumb-ph">
              <i class="ti ti-photo"></i>
            </div>
          {% endif %}

          <div class="mp-card-body">
            <div class="mp-card-name">{{ p[1] }}</div>
            <div class="mp-card-desc">{{ p[3] }}</div>
            <div class="mp-card-footer">
              <span class="mp-price">₹{{ p[2] }}</span>
              <div class="mp-actions">
                <a href="/edit-product/{{ p[0] }}" class="mp-btn-edit">
                  <i class="ti ti-edit"></i> Edit
                </a>
                <a href="/delete-product/{{ p[0] }}" class="mp-btn-del"
                   onclick="return confirm('Delete this product?')">
                  <i class="ti ti-trash"></i> Delete
                </a>
              </div>
            </div>
          </div>

        </div>
        {% endfor %}

      {% else %}

        <div class="mp-empty">
          <i class="ti ti-package-off"></i>
          <p>No products found</p>
        </div>

      {% endif %}

    </div>
  </div>

  <script>
    function toggleDrop() {
      document.getElementById('dropdown').classList.toggle('show');
      document.getElementById('dropCaret').classList.toggle('open');
    }
    window.addEventListener('click', function (e) {
      if (!e.target.closest('.mp-drop-wrap')) {
        document.getElementById('dropdown').classList.remove('show');
        document.getElementById('dropCaret').classList.remove('open');
      }
    });
  </script>

</body>
</html>
