<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      color: #1a2b3c;
    }

    /* ── NAVBAR ── */
    .un-nav {
      background: #0a1520;
      border-bottom: 1px solid rgba(201, 168, 76, 0.33);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .un-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #c9a84c, #f0d98c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .un-links { display: flex; align-items: center; gap: 2px; }
    .un-link {
      color: #a09070;
      font-size: 13px;
      text-decoration: none;
      padding: 6px 11px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .un-link:hover { color: #f0d98c; background: rgba(201, 168, 76, 0.08); }
    .un-link i { font-size: 15px; }

    /* ── CONTENT ── */
    .pd-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    /* BREADCRUMB */
    .pd-breadcrumb {
      font-size: 12px; color: #a09070;
      letter-spacing: 0.5px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 6px;
    }
    .pd-breadcrumb i { font-size: 13px; }
    .pd-breadcrumb a { color: #a09070; text-decoration: none; transition: color 0.2s; }
    .pd-breadcrumb a:hover { color: #c9a84c; }

    /* PRODUCT CARD */
    .pd-card {
      background: #fffdf8;
      border: 1px solid rgba(217, 201, 154, 0.35);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* IMAGE PANEL */
    .pd-image-wrap { position: relative; background: #f0e8d0; }
    .pd-image {
      width: 100%; height: 100%; min-height: 360px;
      object-fit: cover; display: block;
    }
    .pd-image-ph {
      width: 100%; min-height: 360px;
      background: #f0e8d0;
      display: flex; align-items: center; justify-content: center;
    }
    .pd-image-ph i { font-size: 64px; color: #c9a84c; }
    .pd-category-badge {
      position: absolute; top: 16px; left: 16px;
      background: rgba(10, 21, 32, 0.75);
      border: 1px solid rgba(201, 168, 76, 0.4);
      border-radius: 20px; padding: 4px 12px;
      font-size: 11px; color: #f0d98c;
      letter-spacing: 1.5px; text-transform: uppercase;
    }

    /* DETAILS PANEL */
    .pd-details {
      padding: 36px 32px;
      display: flex; flex-direction: column;
    }
    .pd-label {
      font-size: 11px; letter-spacing: 2.5px;
      text-transform: uppercase; color: #7a6e5f;
      margin-bottom: 8px;
    }
    .pd-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px; font-weight: 600;
      color: #0a1520; letter-spacing: 0.5px;
      line-height: 1.2; margin-bottom: 12px;
    }
    .pd-price-row {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 20px;
    }
    .pd-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px; font-weight: 700;
      color: #a8882c;
    }
    .pd-price-label { font-size: 12px; color: #8a7a66; letter-spacing: 1px; }

    /* META CHIPS */
    .pd-meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .pd-meta-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #f0e8d0;
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 20px; padding: 5px 12px;
      font-size: 11px; color: #7a6040; letter-spacing: 0.5px;
    }
    .pd-meta-chip i { font-size: 13px; color: #a8882c; }

    /* DIVIDER */
    .pd-divider { border: none; border-top: 1px solid #e8dfc8; margin: 16px 0; }

    /* DESCRIPTION */
    .pd-desc-label {
      font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: #7a6e5f;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .pd-desc-label i { font-size: 13px; color: #a8882c; }
    .pd-desc {
      font-size: 14px; color: #4a3c28;
      line-height: 1.75; margin-bottom: 28px;
      flex: 1;
    }

    /* ACTION BUTTONS */
    .pd-actions { display: flex; gap: 10px; }
    .pd-btn-cart {
      flex: 1;
      display: inline-flex; align-items: center;
      justify-content: center; gap: 9px;
      background: linear-gradient(135deg, #0d1b2a, #1a3050);
      border: none; border-radius: 10px;
      padding: 14px 20px;
      color: #f0d98c;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.2s; cursor: pointer;
    }
    .pd-btn-cart:hover { opacity: 0.88; }
    .pd-btn-cart i { font-size: 17px; }
    .pd-btn-wish {
      width: 46px; height: 46px;
      background: #f0e8d0;
      border: 1px solid rgba(201, 168, 76, 0.35);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
      flex-shrink: 0; align-self: center;
    }
    .pd-btn-wish:hover { background: #e8dab8; }
    .pd-btn-wish i { font-size: 20px; color: #a8882c; }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .pd-card { grid-template-columns: 1fr; }
      .pd-image { min-height: 220px; }
      .pd-image-ph { min-height: 220px; }
      .pd-details { padding: 22px 18px; }
      .pd-name { font-size: 24px; }
      .pd-price { font-size: 28px; }
      .un-link span { display: none; }
      .un-nav { padding: 0 14px; }
      .pd-container { padding: 20px 12px 40px; }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="un-nav">
    <span class="un-brand">MiniCart</span>
    <div class="un-links">
      <a href="/user-home" class="un-link">
        <i class="ti ti-home"></i><span>Home</span>
      </a>
      <a href="/cart" class="un-link">
        <i class="ti ti-shopping-cart"></i><span>Cart</span>
      </a>
      <a href="/profile" class="un-link">
        <i class="ti ti-user"></i><span>Profile</span>
      </a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="pd-container">

    <!-- BREADCRUMB -->
    <div class="pd-breadcrumb">
      <a href="/user-home"><i class="ti ti-home"></i> Home</a>
      <i class="ti ti-chevron-right"></i>
      <span>{{ product[1] }}</span>
    </div>

    <div class="pd-card">

      <!-- IMAGE PANEL -->
      <div class="pd-image-wrap">
        {% if product[4] %}
          <img src="{{ product[4] }}" class="pd-image" alt="{{ product[1] }}">
        {% else %}
          <div class="pd-image-ph">
            <i class="ti ti-photo"></i>
          </div>
        {% endif %}

        {% if product[5] %}
          <span class="pd-category-badge">{{ product[5] }}</span>
        {% endif %}
      </div>

      <!-- DETAILS PANEL -->
      <div class="pd-details">

        <div class="pd-label">Product Details</div>
        <div class="pd-name">{{ product[1] }}</div>

        <div class="pd-price-row">
          <span class="pd-price">₹{{ product[2] }}</span>
          <span class="pd-price-label">incl. taxes</span>
        </div>

        <div class="pd-meta-row">
          <span class="pd-meta-chip"><i class="ti ti-truck"></i> Free delivery</span>
          <span class="pd-meta-chip"><i class="ti ti-refresh"></i> Easy returns</span>
          <span class="pd-meta-chip"><i class="ti ti-shield-check"></i> Genuine product</span>
        </div>

        <hr class="pd-divider">

        <div class="pd-desc-label">
          <i class="ti ti-info-circle"></i> Description
        </div>
        <div class="pd-desc">{{ product[3] }}</div>

        <!-- ADD TO CART -->
        <div class="pd-actions">
          <a href="/add_to_cart/{{ product[0] }}" class="pd-btn-cart">
            <i class="ti ti-shopping-cart-plus"></i>
            Add to Cart
          </a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
