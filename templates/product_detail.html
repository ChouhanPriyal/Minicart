<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>MiniCart — {{ product.name }}</title>
    <style>
        :root {
            --navy: #1a2235;
            --navy-light: #243048;
            --gold: #c9a84c;
            --cream: #f5f0e8;
            --cream-dark: #ede6d8;
            --text-dark: #1a2235;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--navy);
            padding: 0 2.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .logo span { color: var(--gold); }

        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: color 0.2s;
            position: relative;
            padding-bottom: 2px;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 0; height: 1px;
            background: var(--gold);
            transition: width 0.25s;
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a:hover::after { width: 100%; }

        .cart-badge {
            background: var(--gold);
            color: var(--navy);
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-icons { display: flex; align-items: center; gap: 1.25rem; }
        .nav-icon { color: rgba(255,255,255,0.75); cursor: pointer; transition: color 0.2s; display: flex; align-items: center; }
        .nav-icon:hover { color: #fff; }
        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--navy);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            padding: 1rem 2.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; }
        .breadcrumb a:hover { color: var(--navy); }
        .breadcrumb span { color: var(--navy); font-weight: 500; }

        /* ── PAGE ── */
        .page-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 2rem 5rem;
        }

        /* ── PRODUCT CARD ── */
        .product-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid rgba(26,34,53,0.06);
            box-shadow: 0 4px 32px rgba(26,34,53,0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            min-height: 520px;
        }

        /* Image panel */
        .image-panel {
            position: relative;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
        }
        .product-img {
            width: 100%;
            max-height: 460px;
            object-fit: contain;
            border-radius: 8px;
        }
        .featured-tag {
            position: absolute;
            top: 1.25rem;
            left: 1.25rem;
            background: var(--navy);
            color: var(--gold);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
        }

        /* Details panel */
        .details-panel {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--cream-dark);
        }

        .product-category {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
        }

        .product-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--navy);
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1;
        }
        .price-tax {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .divider { height: 1px; background: var(--cream-dark); margin: 1.25rem 0; }

        .desc-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .product-description {
            font-size: 0.9rem;
            line-height: 1.75;
            color: var(--text-muted);
            flex: 1;
        }

        /* Trust chips */
        .trust-row {
            display: flex;
            gap: 0.625rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        .trust-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--cream);
            border: 1px solid var(--cream-dark);
            border-radius: 20px;
            padding: 0.32rem 0.8rem;
            font-size: 0.73rem;
            font-weight: 500;
            color: var(--navy);
        }
        .trust-chip svg { color: var(--gold); flex-shrink: 0; }

        /* ── CTA BUTTONS ── */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: auto;
        }

        /* Add to Cart — navy primary */
        .btn-cart {
            background: var(--navy);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 9px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .btn-cart:hover {
            background: var(--navy-light);
            box-shadow: 0 6px 20px rgba(26,34,53,0.22);
            transform: translateY(-1px);
        }

        /* Wishlist — outline with heart */
        .btn-wishlist {
            background: transparent;
            color: var(--navy);
            border: 1.5px solid var(--cream-dark);
            padding: 0.875rem;
            border-radius: 9px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-decoration: none;
            color: var(--navy);
            transition: all 0.2s;
        }
        .btn-wishlist:hover {
            border-color: #e57a8a;
            background: #fff5f6;
            color: #b91c3a;
        }
        .btn-wishlist:hover svg {
            stroke: #b91c3a;
            fill: #ffd6dd;
        }
        .btn-wishlist svg { transition: fill 0.2s, stroke 0.2s; }
    </style>
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar">
    <div class="logo">Mini<span>Cart</span></div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/cart">
            <span class="cart-badge">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                Cart
            </span>
        </a>
        <a href="/orders">Orders</a>
        <a href="/profile">Profile</a>
    </div>
    <div class="nav-icons">
        <span class="nav-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        </span>
        <span class="nav-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </span>
        <div class="avatar">S</div>
    </div>
</nav>

<!-- ── BREADCRUMB ── */
<div class="breadcrumb">
    <a href="/">Home</a>
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    <a href="/">Products</a>
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    <span>{{ product.name }}</span>
</div>

<!-- ── PAGE ── -->
<div class="page-wrapper">
    <div class="product-card">

        <!-- Left: Image -->
        <div class="image-panel">
            <span class="featured-tag">Featured</span>
            <img src="{{ url_for('static', filename='uploads/' + product.image) }}"
                 onerror="this.src='/static/default.png'"
                 class="product-img"
                 alt="{{ product.name }}">
        </div>

        <!-- Right: Details -->
        <div class="details-panel">

            <div class="product-category">MiniCart Exclusive</div>

            <h1 class="product-name">{{ product.name }}</h1>

            <div class="price-row">
                <span class="price">₹{{ product.price }}</span>
                <span class="price-tax">incl. tax</span>
            </div>

            <div class="divider"></div>

            <div class="desc-label">About this product</div>
            <p class="product-description">{{ product.description }}</p>

            <!-- Trust chips -->
            <div class="trust-row">
                <div class="trust-chip">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Secure Checkout
                </div>
                <div class="trust-chip">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    Free Delivery
                </div>
                <div class="trust-chip">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                    Easy Returns
                </div>
            </div>

            <!-- CTA -->
            <div class="cta-group">
                <!-- Add to Cart — original href preserved -->
                <a href="/add-to-cart/{{ product.id }}" class="btn-cart">
                    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                    Add to Cart
                </a>

                <!-- Wishlist — original href preserved -->
                <a href="/add-to-wishlist/{{ product.id }}" class="btn-wishlist">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                    Add to Wishlist
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
